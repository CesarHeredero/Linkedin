# ── Snippet para Nginx Proxy Manager / nginx.conf ───────────────────────────
# Pega esto en la configuración de tu proxy para tools.cesarheredero.com
# Host destino: http://localhost:8080

server {
    listen 80;
    server_name tools.cesarheredero.com;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Necesario para el streaming de Claude (SSE)
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

# ── Si usas Nginx Proxy Manager (panel web) ─────────────────────────────────
# 1. Añade nuevo Proxy Host
# 2. Domain: tools.cesarheredero.com
# 3. Scheme: http | Forward Hostname/IP: localhost | Forward Port: 8080
# 4. En "Advanced" pega estas líneas:
#    proxy_buffering off;
#    proxy_read_timeout 120s;
