# ── Configuración para Nginx Proxy Manager ───────────────────────────────────
# Subdominio: agentes.cesarheredero.com → puerto 8082
#
# En NPM (panel en 135.125.102.63:81):
# 1. Nuevo Proxy Host
# 2. Domain Names: agentes.cesarheredero.com
# 3. Scheme: http
# 4. Forward Hostname/IP: 135.125.102.63
# 5. Forward Port: 8082
# 6. Activa "Websockets Support" (necesario para streaming)
# 7. Pestaña "Advanced" → pega el bloque de abajo:

proxy_buffering off;
proxy_read_timeout 120s;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

