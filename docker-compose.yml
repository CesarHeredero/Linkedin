services:
  agentes:
    build: .
    container_name: agentes_app
    restart: always
    ports:
      - "8082:8080"
    env_file:
      - .env
    volumes:
      - ./app/static:/app/static:ro
      - ./credentials.json:/app/credentials.json:ro
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
