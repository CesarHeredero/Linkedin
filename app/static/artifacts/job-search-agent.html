<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Empleo</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#080b0f;color:#e2e8f0;font-family:'Space Mono',monospace}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#080b0f}
    ::-webkit-scrollbar-thumb{background:#1c2230;border-radius:2px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const C = {
  bg:'#080b0f', surface:'#0e1117', border:'#1c2230', accent:'#2dd4bf',
  accentDim:'#0d3530', text:'#e2e8f0', muted:'#64748b', dim:'#334155',
  ok:'#22c55e', error:'#ef4444', warn:'#f59e0b',
};

// ─── Perfil base de César (fallback si no hay perfil optimizado guardado) ──
const PERFIL_BASE = {
  nombre: 'César Heredero Herranz',
  titular: 'Lead UX/UI & Product Owner | Ecommerce & Producto Digital',
  email: 'heredero.cesar@gmail.com',
  linkedin: 'linkedin.com/in/cesarheredero',
  ubicacion: 'Algete, Madrid, España',
  about: `Lead UX/UI y Product Owner con 10+ años de experiencia en producto digital y ecommerce.
En Grupo Flexicar lidero proyectos end-to-end: desde visión estratégica hasta entrega, coordinando equipos de Dev, Marketing, SEO e Infraestructura.
Anteriormente 6.5 años en Devoteam/Toyota España. Ganador Hackathon CardioXplore a nivel europeo.
Busco roles de Lead UX/UI, Senior PO o Product Manager en empresas de producto digital. Preferencia: remoto/híbrido en España.`,
  experiencia: [
    { empresa: 'Grupo Flexicar', rol: 'Lead UX/UI & Product Owner', periodo: 'Abril 2023 – Presente', descripcion: 'Liderazgo de producto y UX en ecommerce de automoción para España y Portugal. 8+ proyectos simultáneos, definición de épicas, HUs y criterios de aceptación. Coordinación multidisciplinar.' },
    { empresa: 'Devoteam / Toyota España', rol: 'Consultant UX/UI Designer', periodo: 'Dic 2016 – Abr 2023', descripcion: '6 años 5 meses en Toyota España. Ganador Hackathon CardioXplore europeo (oct 2021).' },
  ],
  skills: ['UX/UI Design', 'Product Owner', 'Figma', 'Agile/Scrum', 'n8n', 'A/B Testing', 'CMS Headless', 'Analítica Web'],
  logros: [
    '8+ proyectos liderados como PO en paralelo',
    '30+ historias de usuario con criterios de aceptación',
    'Migración de 1.092+ URLs preservando SEO',
    'Ganador Hackathon CardioXplore a nivel europeo',
  ],
  busqueda: 'Lead UX/UI, Senior Product Owner, Product Manager en producto digital / ecommerce. Remoto o híbrido, España.',
};

// ─── Estilos ──────────────────────────────────────────────────────────────────
const S = {
  card:{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:'20px 22px' },
  label:{ fontSize:10, letterSpacing:3, color:C.accent, marginBottom:8, display:'block' },
  labelMuted:{ fontSize:10, letterSpacing:3, color:C.muted, marginBottom:6, display:'block' },
  text:{ fontSize:13, color:C.text, lineHeight:1.8 },
  small:{ fontSize:12, color:C.muted, lineHeight:1.7 },
  btnPrimary:{ background:C.accent, color:'#000', border:'none', borderRadius:8, padding:'10px 22px', fontFamily:"'Space Mono',monospace", fontSize:12, fontWeight:700, cursor:'pointer' },
  btnSec:{ background:'transparent', color:C.accent, border:`1px solid ${C.accent}`, borderRadius:8, padding:'9px 18px', fontFamily:"'Space Mono',monospace", fontSize:12, cursor:'pointer' },
  btnGhost:{ background:'transparent', color:C.muted, border:`1px solid ${C.border}`, borderRadius:8, padding:'8px 16px', fontFamily:"'Space Mono',monospace", fontSize:11, cursor:'pointer' },
  input:{ width:'100%', background:'#05080c', border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontFamily:"'Space Mono',monospace", fontSize:12, padding:'9px 14px', outline:'none' },
  tag:{ display:'inline-block', background:C.accentDim, color:C.accent, borderRadius:4, padding:'2px 8px', fontSize:10, marginRight:4, marginBottom:3 },
};

// ─── Llamada a Claude ─────────────────────────────────────────────────────────
async function callClaude(messages, system = '', maxTokens = 3000) {
  const body = { model: 'claude-sonnet-4-6', max_tokens: maxTokens, messages };
  if (system) body.system = system;
  const r = await fetch('/api/claude', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.detail || `Error Claude ${r.status}`);
  return d.content?.[0]?.text || '';
}

function parseJSON(text) {
  try { return JSON.parse(text); } catch {}
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a !== -1 && b !== -1) try { return JSON.parse(text.slice(a, b + 1)); } catch {}
  return null;
}

// ─── App ─────────────────────────────────────────────────────────────────────
function BuscadorApp() {
  const [fase, setFase] = useState('buscar');   // buscar | cv | telegram
  const [query, setQuery] = useState('Lead UX Product Owner');
  const [ofertas, setOfertas] = useState([]);
  const [buscando, setBuscando] = useState(false);
  const [ofertaSeleccionada, setOfertaSeleccionada] = useState(null);
  const [generando, setGenerando] = useState(false);
  const [cvResult, setCvResult] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const [enviado, setEnviado] = useState(null);
  const [logs, setLogs] = useState([]);
  const [perfilOptimizado, setPerfilOptimizado] = useState(null);
  const logRef = useRef(null);

  // Cargar perfil optimizado del módulo Perfil
  useEffect(() => {
    fetch('/api/perfil').then(r => r.json()).then(d => {
      if (d.perfil?.optimizado) setPerfilOptimizado(d.perfil.optimizado);
    }).catch(() => {});
  }, []);

  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [logs]);

  const log = (msg, tipo = 'info') => setLogs(p => [...p, { msg, tipo }]);

  // ── Buscar ofertas ──────────────────────────────────────────────────────────
  const buscar = async () => {
    setBuscando(true);
    setOfertas([]);
    setOfertaSeleccionada(null);
    setCvResult(null);
    log('🔍 Buscando en Adzuna…');
    try {
      const r = await fetch(`/api/jobs?q=${encodeURIComponent(query)}&location=España`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || `Error ${r.status}`);
      setOfertas(d.ofertas || []);
      log(`✓ ${d.ofertas?.length || 0} ofertas encontradas (de ${d.total} en Adzuna)`, 'ok');
      if (!d.ofertas?.length) log('Sin resultados. Prueba con otro término de búsqueda.', 'warn');
    } catch (e) {
      log(`✗ ${e.message}`, 'error');
    }
    setBuscando(false);
  };

  // ── Generar CV ──────────────────────────────────────────────────────────────
  const generarCV = async () => {
    if (!ofertaSeleccionada) return;
    setGenerando(true);
    setCvResult(null);
    log(`📄 Generando CV para ${ofertaSeleccionada.empresa} – ${ofertaSeleccionada.titulo}…`);

    // Usar perfil optimizado si está disponible, si no el base
    const p = perfilOptimizado
      ? {
          titular: perfilOptimizado.titular,
          about: perfilOptimizado.about,
          experiencia: `Grupo Flexicar: ${perfilOptimizado.experiencia_flexicar?.titulo} (Abril 2023 – Presente)\n${perfilOptimizado.experiencia_flexicar?.bullets?.map(b => `• ${b}`).join('\n')}\n\nDevoteam/Toyota: ${perfilOptimizado.experiencia_devoteam?.titulo} (Dic 2016 – Abr 2023)\n${perfilOptimizado.experiencia_devoteam?.bullets?.map(b => `• ${b}`).join('\n')}`,
          skills: [...(perfilOptimizado.skills_top5 || []), ...(perfilOptimizado.skills_adicionales || [])].join(', '),
          logros: perfilOptimizado.logros_clave?.join('\n'),
        }
      : {
          titular: PERFIL_BASE.titular,
          about: PERFIL_BASE.about,
          experiencia: PERFIL_BASE.experiencia.map(e => `${e.empresa}: ${e.rol} (${e.periodo}) – ${e.descripcion}`).join('\n\n'),
          skills: PERFIL_BASE.skills.join(', '),
          logros: PERFIL_BASE.logros.join('\n'),
        };

    const system = `Eres experto en RRHH y redacción de CVs para perfiles de producto digital en España.
Dado el perfil y la oferta, genera el CV personalizado.
OBJETIVO DEL CANDIDATO: Lead UX/UI, Senior Product Owner, o Product Manager. No busca roles de especialista técnico (SEO, Analytics, WPO).
Responde SOLO con JSON válido, sin backticks ni texto adicional:
{
  "cv_resumen": "Resumen ejecutivo 3-4 líneas adaptado específicamente a esta oferta",
  "propuesta_valor": "Párrafo de propuesta de valor para esta empresa concreta (3-4 frases)",
  "logros_destacados": ["logro con métrica relevante para esta oferta 1", "logro 2", "logro 3"],
  "carta_presentacion": "Carta completa en 4 párrafos: gancho → experiencia relevante → encaje con la empresa → cierre",
  "keywords_detectadas": ["keyword de la oferta 1", "keyword 2", "keyword 3", "keyword 4", "keyword 5"],
  "encaje": número del 1 al 100 indicando encaje con la oferta
}`;

    const prompt = `PERFIL DE CÉSAR:
Titular: ${p.titular}
About: ${p.about}

Experiencia:
${p.experiencia}

Skills: ${p.skills}
Logros: ${p.logros}
Búsqueda: Lead UX/UI, Senior PO o PM en producto digital / ecommerce. Remoto/híbrido España.

OFERTA:
Empresa: ${ofertaSeleccionada.empresa}
Título: ${ofertaSeleccionada.titulo}
Ubicación: ${ofertaSeleccionada.ubicacion} · ${ofertaSeleccionada.modalidad}
Salario: ${ofertaSeleccionada.salario}
Descripción: ${ofertaSeleccionada.descripcion}`;

    try {
      log('🤖 Claude Sonnet adaptando CV…', 'info');
      const raw = await callClaude([{ role: 'user', content: prompt }], system);
      const parsed = parseJSON(raw);
      if (!parsed) throw new Error('Respuesta no válida. Inténtalo de nuevo.');
      setCvResult(parsed);
      log(`✓ CV generado (encaje estimado: ${parsed.encaje}%)`, 'ok');
    } catch (e) {
      log(`✗ ${e.message}`, 'error');
    }
    setGenerando(false);
  };

  // ── Notificar Telegram ──────────────────────────────────────────────────────
  const notificar = async () => {
    if (!ofertaSeleccionada || !cvResult) return;
    setEnviando(true);
    setEnviado(null);
    log('📬 Enviando a Telegram…');

    const encaje = cvResult.encaje ? `${cvResult.encaje}%` : 'N/D';
    const msg = `🤖 <b>Job Search Agent</b>

🎯 <b>Nueva candidatura generada</b>

🏢 <b>${ofertaSeleccionada.empresa}</b>
💼 ${ofertaSeleccionada.titulo}
📍 ${ofertaSeleccionada.ubicacion} · ${ofertaSeleccionada.modalidad}
💰 ${ofertaSeleccionada.salario}
📊 Encaje estimado: <b>${encaje}</b>
${ofertaSeleccionada.url ? `🔗 <a href="${ofertaSeleccionada.url}">Ver oferta</a>` : ''}

🔑 <b>Keywords:</b> ${cvResult.keywords_detectadas?.join(', ') || 'N/D'}

✅ CV personalizado generado
✉️ Carta de presentación lista`;

    try {
      const r = await fetch('/api/telegram', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: msg }),
      });
      const d = await r.json();
      if (r.ok && d.ok) {
        setEnviado('ok');
        log('✓ Notificación enviada a Telegram', 'ok');
      } else {
        setEnviado('error');
        log(`✗ Error Telegram: ${d.detail || 'desconocido'}`, 'error');
      }
    } catch (e) {
      setEnviado('error');
      log(`✗ ${e.message}`, 'error');
    }
    setEnviando(false);
  };

  const fases = [
    { id:'buscar', label:'🔍 Buscar', done: ofertas.length > 0 },
    { id:'cv',     label:'📄 CV',     done: !!cvResult },
    { id:'telegram', label:'📬 Telegram', done: enviado === 'ok' },
  ];

  return (
    <div style={{ minHeight:'100vh', background:C.bg, fontFamily:"'Space Mono',monospace", color:C.text, padding:'20px', maxWidth:860, margin:'0 auto' }}>

      {/* Header */}
      <div style={{ marginBottom:24 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
          <div style={{ width:7, height:7, borderRadius:'50%', background:C.accent, boxShadow:`0 0 8px ${C.accent}`, animation:'pulse 2s infinite' }} />
          <span style={{ color:C.accent, fontSize:10, letterSpacing:'0.18em' }}>BUSCADOR DE EMPLEO</span>
        </div>
        <h1 style={{ fontSize:20, fontWeight:700, color:'#fff', letterSpacing:'-0.02em', marginBottom:2 }}>Job Search Agent</h1>
        <p style={{ fontSize:11, color:C.muted }}>{PERFIL_BASE.nombre} · {perfilOptimizado ? 'usando perfil optimizado ✓' : 'perfil base'}</p>
      </div>

      {/* Pipeline nav */}
      <div style={{ display:'flex', gap:6, marginBottom:20, flexWrap:'wrap' }}>
        {fases.map((f, i) => (
          <div key={f.id} style={{ display:'flex', alignItems:'center', gap:6 }}>
            <div onClick={() => setFase(f.id)} style={{
              padding:'7px 16px', borderRadius:999, fontSize:11, cursor:'pointer',
              border:`1px solid ${f.id === fase ? C.accent : f.done ? C.ok : C.border}`,
              background: f.id === fase ? C.accentDim : 'transparent',
              color: f.id === fase ? C.accent : f.done ? C.ok : C.muted,
            }}>
              {f.label}{f.done ? ' ✓' : ''}
            </div>
            {i < fases.length - 1 && <span style={{ color:C.dim, fontSize:12 }}>→</span>}
          </div>
        ))}
      </div>

      {/* ── FASE BUSCAR ─────────────────────────────────────────────────────── */}
      {fase === 'buscar' && (
        <div style={{ ...S.card, animation:'fadeIn 0.3s ease' }}>
          <span style={S.label}>BUSCAR OFERTAS</span>
          <p style={{ ...S.small, marginBottom:14 }}>Ofertas reales de <strong style={{ color:C.text }}>Adzuna</strong> — agrega InfoJobs, LinkedIn, Indeed y otras fuentes en España.</p>

          <div style={{ display:'flex', gap:8, marginBottom:16 }}>
            <input
              style={S.input}
              value={query}
              onChange={e => setQuery(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && buscar()}
              placeholder="Lead UX Product Owner, Product Manager…"
            />
            <button onClick={buscar} disabled={buscando || !query.trim()} style={{ ...S.btnPrimary, whiteSpace:'nowrap', opacity: buscando ? 0.6 : 1 }}>
              {buscando ? 'Buscando…' : 'Buscar →'}
            </button>
          </div>

          {ofertas.length > 0 && (
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {ofertas.map(o => (
                <div key={o.id} onClick={() => setOfertaSeleccionada(o)} style={{
                  background: ofertaSeleccionada?.id === o.id ? C.accentDim : '#05080c',
                  border: `1px solid ${ofertaSeleccionada?.id === o.id ? C.accent : C.border}`,
                  borderRadius:10, padding:14, cursor:'pointer',
                }}>
                  <div style={{ fontWeight:700, color:'#fff', fontSize:13, marginBottom:2 }}>{o.titulo}</div>
                  <div style={{ color:C.accent, fontSize:11, marginBottom:6 }}>{o.empresa} · {o.ubicacion}</div>
                  <div style={{ display:'flex', gap:12, fontSize:10, color:C.muted, flexWrap:'wrap' }}>
                    <span>💰 {o.salario}</span>
                    <span>🏠 {o.modalidad}</span>
                    {o.fecha && <span>📅 {o.fecha}</span>}
                  </div>
                  {ofertaSeleccionada?.id === o.id && (
                    <div style={{ marginTop:12, paddingTop:12, borderTop:`1px solid ${C.accent}` }}>
                      <p style={{ ...S.small, marginBottom:12, lineHeight:1.7 }}>{o.descripcion}</p>
                      <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                        <button onClick={e => { e.stopPropagation(); setFase('cv'); }} style={S.btnPrimary}>
                          Generar CV para esta oferta →
                        </button>
                        {o.url && (
                          <a href={o.url} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()}
                            style={{ ...S.btnGhost, textDecoration:'none', display:'inline-flex', alignItems:'center' }}>
                            🔗 Ver oferta real
                          </a>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {ofertas.length === 0 && !buscando && (
            <div style={{ padding:32, textAlign:'center', border:`1px dashed ${C.border}`, borderRadius:10, color:C.dim, fontSize:12 }}>
              Pulsa "Buscar" para encontrar ofertas en España
            </div>
          )}
        </div>
      )}

      {/* ── FASE CV ─────────────────────────────────────────────────────────── */}
      {fase === 'cv' && (
        <div style={{ ...S.card, animation:'fadeIn 0.3s ease' }}>
          <span style={S.label}>CV PERSONALIZADO</span>

          {!ofertaSeleccionada ? (
            <div style={{ padding:24, textAlign:'center', border:`1px dashed ${C.border}`, borderRadius:10, color:C.dim, fontSize:12 }}>
              Primero selecciona una oferta
              <br /><button onClick={() => setFase('buscar')} style={{ ...S.btnGhost, marginTop:12 }}>← Buscar ofertas</button>
            </div>
          ) : (
            <>
              <div style={{ padding:'10px 14px', background:C.accentDim, border:`1px solid ${C.accent}`, borderRadius:8, marginBottom:14, fontSize:12 }}>
                <span style={{ color:C.accent, fontWeight:700 }}>{ofertaSeleccionada.empresa}</span>
                <span style={{ color:C.muted }}> · {ofertaSeleccionada.titulo} · {ofertaSeleccionada.ubicacion}</span>
              </div>

              {perfilOptimizado && (
                <div style={{ fontSize:10, color:C.ok, marginBottom:12, padding:'6px 12px', background:'rgba(34,197,94,0.06)', border:'1px solid rgba(34,197,94,0.2)', borderRadius:6 }}>
                  ✓ Usando perfil optimizado del módulo Perfil
                </div>
              )}

              <button onClick={generarCV} disabled={generando} style={{ ...S.btnPrimary, opacity: generando ? 0.6 : 1 }}>
                {generando ? '⏳ Generando…' : '🤖 Generar CV personalizado'}
              </button>

              {cvResult && (
                <div style={{ marginTop:20, display:'flex', flexDirection:'column', gap:14, animation:'fadeIn 0.3s ease' }}>
                  {[
                    { label:'Resumen ejecutivo', key:'cv_resumen' },
                    { label:`Propuesta de valor para ${ofertaSeleccionada.empresa}`, key:'propuesta_valor' },
                    { label:'Carta de presentación', key:'carta_presentacion' },
                  ].map(({ label, key }) => cvResult[key] && (
                    <div key={key}>
                      <span style={S.labelMuted}>{label.toUpperCase()}</span>
                      <div style={{ background:'#05080c', border:`1px solid ${C.border}`, borderRadius:8, padding:12, fontSize:12, lineHeight:1.8, whiteSpace:'pre-wrap', color:C.text }}>
                        {cvResult[key]}
                      </div>
                    </div>
                  ))}

                  {cvResult.logros_destacados?.length > 0 && (
                    <div>
                      <span style={S.labelMuted}>LOGROS DESTACADOS PARA ESTA OFERTA</span>
                      {cvResult.logros_destacados.map((l, i) => (
                        <div key={i} style={{ display:'flex', gap:8, marginBottom:6, fontSize:12 }}>
                          <span style={{ color:C.accent }}>→</span>
                          <span>{l}</span>
                        </div>
                      ))}
                    </div>
                  )}

                  <div style={{ display:'flex', alignItems:'center', gap:16, flexWrap:'wrap' }}>
                    {cvResult.keywords_detectadas?.length > 0 && (
                      <div style={{ flex:1 }}>
                        <span style={S.labelMuted}>KEYWORDS DE LA OFERTA</span>
                        <div>{cvResult.keywords_detectadas.map(k => <span key={k} style={{ ...S.tag, background:'rgba(34,197,94,0.06)', color:C.ok, border:'1px solid rgba(34,197,94,0.2)' }}>{k}</span>)}</div>
                      </div>
                    )}
                    {cvResult.encaje && (
                      <div style={{ textAlign:'center', padding:'10px 20px', border:`1px solid ${C.accent}`, borderRadius:10 }}>
                        <div style={{ fontSize:22, fontWeight:700, color:C.accent }}>{cvResult.encaje}%</div>
                        <div style={{ fontSize:10, color:C.muted }}>ENCAJE</div>
                      </div>
                    )}
                  </div>

                  <button onClick={() => setFase('telegram')} style={S.btnSec}>
                    📬 Notificar por Telegram →
                  </button>
                </div>
              )}
            </>
          )}
        </div>
      )}

      {/* ── FASE TELEGRAM ───────────────────────────────────────────────────── */}
      {fase === 'telegram' && (
        <div style={{ ...S.card, animation:'fadeIn 0.3s ease' }}>
          <span style={S.label}>NOTIFICACIÓN TELEGRAM</span>

          {!cvResult ? (
            <div style={{ padding:24, textAlign:'center', border:`1px dashed ${C.border}`, borderRadius:10, color:C.dim, fontSize:12 }}>
              Primero genera el CV
              <br /><button onClick={() => setFase('cv')} style={{ ...S.btnGhost, marginTop:12 }}>← Ir a CV</button>
            </div>
          ) : (
            <>
              <div style={{ background:'#05080c', border:`1px solid ${C.border}`, borderRadius:10, padding:16, marginBottom:16, fontSize:12, lineHeight:1.9 }}>
                <div style={{ color:C.accent, fontWeight:700, marginBottom:8 }}>Mensaje que se enviará:</div>
                <div style={{ color:C.muted }}>
                  🏢 <strong style={{ color:C.text }}>{ofertaSeleccionada?.empresa}</strong> · {ofertaSeleccionada?.titulo}<br />
                  📍 {ofertaSeleccionada?.ubicacion} · {ofertaSeleccionada?.modalidad}<br />
                  💰 {ofertaSeleccionada?.salario}<br />
                  {cvResult.encaje && <>📊 Encaje: <strong style={{ color:C.accent }}>{cvResult.encaje}%</strong><br /></>}
                  🔑 Keywords: {cvResult.keywords_detectadas?.join(', ')}<br />
                  ✅ CV personalizado generado<br />
                  ✉️ Carta de presentación lista
                </div>
              </div>

              <button onClick={notificar} disabled={enviando} style={{ ...S.btnPrimary, opacity: enviando ? 0.6 : 1 }}>
                {enviando ? 'Enviando…' : '📤 Enviar a Telegram'}
              </button>

              {enviado === 'ok' && (
                <div style={{ marginTop:12, padding:'10px 16px', background:'rgba(34,197,94,0.06)', border:`1px solid ${C.ok}`, borderRadius:8, color:C.ok, fontSize:12 }}>
                  ✅ Notificación enviada. Revisa tu Telegram.
                </div>
              )}
              {enviado === 'error' && (
                <div style={{ marginTop:12, padding:'10px 16px', background:'rgba(239,68,68,0.06)', border:`1px solid ${C.error}`, borderRadius:8, color:C.error, fontSize:12 }}>
                  ✗ Error al enviar. Verifica la configuración del servidor.
                </div>
              )}
            </>
          )}
        </div>
      )}

      {/* Console */}
      {logs.length > 0 && (
        <div style={{ marginTop:20 }}>
          <span style={S.labelMuted}>CONSOLE</span>
          <div ref={logRef} style={{ background:'#03050a', border:`1px solid ${C.border}`, borderRadius:8, padding:'10px 14px', maxHeight:140, overflowY:'auto', fontSize:11 }}>
            {logs.map((l, i) => (
              <div key={i} style={{ color: l.tipo==='ok'?C.ok:l.tipo==='error'?C.error:l.tipo==='warn'?C.warn:C.muted, marginBottom:2 }}>
                <span style={{ color:C.dim }}>› </span>{l.msg}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BuscadorApp />);
</script>
</body>
</html>
