- Audiencia LinkedIn: recruiters de producto/UX, Product Managers, UX Designers, directores digitales, equipos de ecommerce, profesionales de SEO/analítica
- Idioma: siempre en español

REGLAS ABSOLUTAS:
- NUNCA menciones a tu empresa actual ni a ningún empleador por nombre

Responde SOLO en JSON válido:
{

POSICIÓN: "${pos.titulo}"
ARGUMENTO BASE: "${pos.argumento}"
CONTEXTO: ${inv.contexto}

150-200 palabras. Usa ejemplos del mundo real (ecommerce, producto digital, UX). Tono directo. Termina con pregunta o afirmación provocadora.
Solo el texto del argumento, sin títulos ni markdown.`,

  debatista_b: (inv, pos, argA) => `${CESAR_PROFILE}

Eres el AGENTE DEBATISTA B. Defiendes una posición contraria.

Solo el texto, sin títulos ni markdown.`,

  editor: (tema, inv, argA, argB, formato) => `${CESAR_PROFILE}

Eres el AGENTE EDITOR. Presenciaste el debate sobre: "${tema}"
PERSPECTIVA A (${inv.posicion_a?.titulo}): "${argA}"
PERSPECTIVA B (${inv.posicion_b?.titulo}): "${argB}"
Contexto: ${inv.contexto}

Escribe un ${formato === 'post' ? 'post de LinkedIn' : 'artículo de reflexión para LinkedIn'} desde la voz de César.

${formato === 'post' ? `REGLAS POST:
- 300-500 palabras máximo
- Empieza con un gancho fuerte (NO "Hoy quiero hablar de...")
- Saltos de línea frecuentes (máx 2-3 líneas por párrafo)
- Incluye la tensión del debate pero llega a una conclusión propia
- Ejemplos genéricos del sector, nunca de tu empresa actual
- Termina con UNA pregunta a la audiencia
- Máximo 3-4 hashtags al final` : `REGLAS ARTÍCULO:
- 600-900 palabras
- Estructura: Gancho → Contexto → Las dos caras → Tu posición → Conclusión accionable
- Párrafos cortos, lenguaje directo
- Usa ejemplos genéricos y reconocibles del sector digital (no de tu empresa)
- Termina con reflexión y pregunta abierta
- Máximo 4-5 hashtags al final`}

Solo el texto listo para copiar en LinkedIn.`,

  critico: (contenido, formato) => `Eres el AGENTE CRÍTICO. Evalúa este ${formato} de LinkedIn.

CONTENIDO:
"${contenido}"

Responde SOLO en JSON:
{
  "puntuacion": número del 1 al 10,
  "gancho": "evaluación del inicio en 1 frase",
  "voz": "¿suena humano y auténtico o genérico?",
  "puntos_fuertes": ["punto 1", "punto 2"],
  "mejoras": ["mejora concreta 1", "mejora concreta 2"],
  "veredicto": "PUBLICAR YA | REVISAR MENOR | REESCRIBIR"
}`,

  imagen: (tema, contenido) => `LinkedIn post topic: "${tema}"
Post excerpt: "${contenido.substring(0, 200)}"

Generate a SHORT image prompt (max 25 words) for an AI image generator to create a professional LinkedIn cover image.
Requirements: abstract/conceptual, no text, no letters, dark tones, clean minimal, tech/business aesthetic.
Reply ONLY with the English image prompt.`,
};

// ─── Temas sugeridos ──────────────────────────────────────────────────────────

    'El backlog infinito: síntoma de falta de estrategia',

  { cat: 'UX & Diseño', icon: '◇', items: [

// ─── Llamada a Claude vía servidor (streaming) ────────────────────────────────
async function callClaudeStream(prompt, onChunk) {
  const res = await fetch(API_CLAUDE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1500,
      stream: true,
      messages: [{ role: 'user', content: prompt }],
    }),
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || `Error ${res.status}`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value);
    const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
    for (const line of lines) {
      try {
        const data = JSON.parse(line.slice(6));
        if (data.type === 'content_block_delta' && data.delta?.text) {
          full += data.delta.text;
          onChunk(full);
        }
      } catch {}
    }
  }
  return full;
}

// ─── Llamada a Gemini vía servidor (sin streaming) ───────────────────────────
async function callGemini(prompt, maxTokens = 2048) {
  const res = await fetch(API_GEMINI, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, max_tokens: maxTokens }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || `Error Gemini ${res.status}`);
  }
  const data = await res.json();
  return data.text || '';
}

// ─── Colores ──────────────────────────────────────────────────────────────────
const DARK_C = {
  bg: '#080b0f', panel: '#0e1117', border: '#1c2230',
  accent: '#2dd4bf', accentDim: '#0d3530', gold: '#F59E0B',
  green: '#10B981', red: '#EF4444', text: '#e2e8f0',
  muted: '#64748b', card: '#0e1117',
};

const LIGHT_C = {
  bg: '#f1f5f9', panel: '#ffffff', border: '#e2e8f0',
  accent: '#0d9488', accentDim: 'rgba(13,148,136,0.08)', gold: '#b45309',
  green: '#059669', red: '#dc2626', text: '#0f172a',
  muted: '#64748b', card: '#ffffff',
};

// ─── Componente principal ─────────────────────────────────────────────────────
function LinkedInAgent({ isDark }) {
  const C = isDark ? DARK_C : LIGHT_C;

  const S = {
    app: { minHeight: '100vh', background: C.bg, color: C.text, fontFamily: "'Space Mono', monospace", padding: 0 },
    header: { background: isDark ? 'linear-gradient(135deg, #0e1117 0%, #111827 100%)' : 'linear-gradient(135deg, #ffffff 0%, #f8fafc 100%)', padding: '28px 32px 20px', borderBottom: `1px solid ${C.border}` },
    logo: { fontSize: 11, letterSpacing: 4, color: C.accent, fontFamily: 'monospace', marginBottom: 6 },
    title: { fontSize: 22, fontWeight: 'bold', color: C.text, margin: '0 0 4px' },
    subtitle: { fontSize: 13, color: C.muted, fontFamily: 'system-ui' },
    main: { padding: '28px 32px', maxWidth: 820, margin: '0 auto' },
    sTitle: { fontSize: 11, letterSpacing: 3, color: C.accent, fontFamily: 'monospace', marginBottom: 16, display: 'block' },
    catLabel: { fontSize: 10, letterSpacing: 2, color: C.gold, fontFamily: 'monospace', marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 },
    temaCard: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '11px 16px', cursor: 'pointer', fontSize: 14, color: C.text, fontFamily: 'system-ui', transition: 'all 0.15s', marginBottom: 8, textAlign: 'left', width: '100%' },
    temaCardHover: { borderColor: C.accent, background: isDark ? '#111827' : '#f0fdf9' },
    btn: { background: C.accent, color: isDark ? '#fff' : '#fff', border: 'none', borderRadius: 8, padding: '12px 28px', fontSize: 14, fontFamily: 'system-ui', fontWeight: 600, cursor: 'pointer' },
    btnSecondary: { background: 'transparent', color: C.accent, border: `1px solid ${C.accent}`, borderRadius: 8, padding: '10px 22px', fontSize: 13, fontFamily: 'system-ui', cursor: 'pointer' },
    input: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '12px 16px', fontSize: 14, color: C.text, fontFamily: 'system-ui', width: '100%', boxSizing: 'border-box', outline: 'none' },
    logBox: { background: isDark ? '#05080c' : '#f8fafc', border: `1px solid ${C.border}`, borderRadius: 8, padding: 16, fontFamily: 'monospace', fontSize: 12, minHeight: 120, maxHeight: 200, overflowY: 'auto' },
    streamBox: { background: isDark ? '#05080c' : '#f0fdf9', border: `1px solid ${C.accentDim}`, borderRadius: 8, padding: 16, fontFamily: 'system-ui', fontSize: 13, color: isDark ? '#5eead4' : '#0d9488', minHeight: 80, maxHeight: 220, overflowY: 'auto', whiteSpace: 'pre-wrap', lineHeight: 1.6 },
    contentBox: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: 24, fontSize: 14, lineHeight: 1.75, fontFamily: 'system-ui', color: C.text, whiteSpace: 'pre-wrap', minHeight: 200 },
    pill: (v) => ({ display: 'inline-block', background: v === 'PUBLICAR YA' ? '#065F46' : v === 'REVISAR MENOR' ? '#78350F' : '#7F1D1D', color: '#fff', borderRadius: 20, padding: '4px 14px', fontSize: 12, fontWeight: 'bold' }),
    formatBtn: (active) => ({ background: active ? C.accent : C.card, color: active ? '#fff' : C.muted, border: `1px solid ${active ? C.accent : C.border}`, borderRadius: 8, padding: '10px 24px', fontSize: 13, fontFamily: 'system-ui', cursor: 'pointer', fontWeight: active ? 600 : 400 }),
  };

  const logColor = { agente: C.accent, ok: isDark ? '#34D399' : '#059669', error: isDark ? '#F87171' : '#dc2626', info: C.muted };

  const [fase, setFase] = useState('inicio');
  const [temaPersonalizado, setTemaPersonalizado] = useState('');
  const [temaSeleccionado, setTemaSeleccionado] = useState(null);
  const [formato, setFormato] = useState('post');
  const [logs, setLogs] = useState([]);
  const [investigacion, setInvestigacion] = useState(null);
  const [argA, setArgA] = useState('');
  const [argB, setArgB] = useState('');
  const [contenido, setContenido] = useState('');
  const [critica, setCritica] = useState(null);
  const [streamText, setStreamText] = useState('');
  const [faseActual, setFaseActual] = useState('');
  const [copiado, setCopiado] = useState(false);
  const [hoveredTema, setHoveredTema] = useState(null);
  const [imagenUrl, setImagenUrl] = useState('');
  const [historial, setHistorial] = useState([]);

  useEffect(() => {
    fetch('/api/historial').then(r => r.ok ? r.json() : null).then(d => {
      if (d?.historial) setHistorial(d.historial.map(r => ({
        id: r.ID, fecha: r.Fecha, tema: r.Tema, formato: r.Formato, contenido: r.Contenido, imagenUrl: r.ImagenURL
      })));
    }).catch(() => {});
  }, []);
  const bottomRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [logs, streamText]);

  const addLog = (msg, tipo = 'info') => setLogs(l => [...l, { msg, tipo, t: Date.now() }]);

  const elegirTema = (tema) => { setTemaSeleccionado(tema); setFase('formato'); };

  const iniciarGeneracion = async () => {
    setFase('generando');
    setLogs([]);
    setStreamText('');
    setInvestigacion(null);
    setImagenUrl('');
    setArgA(''); setArgB(''); setContenido(''); setCritica(null);

    try {
      // Agente 1: Investigador → Gemini Flash (gratis)
      setFaseActual('investigador');
      addLog('🔍 Investigador analizando el tema... [Gemini]', 'agente');
      const rawInv = await callGemini(PROMPTS.investigador(temaSeleccionado));
      let inv;
      try {
        const m = rawInv.match(/\{[\s\S]*\}/);
        inv = JSON.parse(m ? m[0] : rawInv);
      } catch { throw new Error('El investigador no devolvió JSON válido'); }
      setInvestigacion(inv);
      addLog(`✓ Análisis listo. Ángulos: ${inv.angulos?.join(' · ')}`, 'ok');

      // Agente 2: Debatista A → Gemini Flash (gratis)
      setFaseActual('debatista_a');
      addLog(`⚔️ Agente A: "${inv.posicion_a?.titulo}" [Gemini]`, 'agente');
      const texA = await callGemini(PROMPTS.debatista_a(inv, inv.posicion_a));
      setArgA(texA);
      addLog('✓ Posición A completada', 'ok');

      // Agente 3: Debatista B → Gemini Flash (gratis)
      setFaseActual('debatista_b');
      addLog(`⚔️ Agente B: "${inv.posicion_b?.titulo}" [Gemini]`, 'agente');
      const texB = await callGemini(PROMPTS.debatista_b(inv, inv.posicion_b, texA));
      setArgB(texB);
      addLog('✓ Posición B completada', 'ok');

      // Agente 4: Editor → Claude Sonnet streaming (pago, máxima calidad)
      setFaseActual('editor');
      addLog(`✍️ Editor escribiendo el ${formato}... [Claude]`, 'agente');
      let texC = '';
      await callClaudeStream(PROMPTS.editor(temaSeleccionado, inv, texA, texB, formato), t => { texC = t; setStreamText(t); });
      setStreamText('');
      setContenido(texC);
      addLog('✓ Contenido listo', 'ok');

      // Agente 5: Crítico → Gemini Flash (gratis)
      setFaseActual('critico');
      addLog('🎯 Crítico evaluando... [Gemini]', 'agente');
      const texD = await callGemini(PROMPTS.critico(texC, formato));
      try {
        const m2 = texD.match(/\{[\s\S]*\}/);
        setCritica(JSON.parse(m2 ? m2[0] : texD));
      } catch { setCritica(null); }
      addLog('✓ Evaluación completada', 'ok');

      // Agente 6: Imagen → Gemini genera prompt → Pollinations.ai vía backend (evita rate limit IP)
      setFaseActual('imagen');
      addLog('🖼️ Generando imagen para LinkedIn... [Pollinations via servidor]', 'agente');
      const imgPromptRaw = await callGemini(PROMPTS.imagen(temaSeleccionado, texC), 100);
      const imgPrompt = imgPromptRaw.trim().replace(/["']/g, '');
      const seed = Math.floor(Math.random() * 99999);
      const url = `/api/image?prompt=${encodeURIComponent(imgPrompt)}&width=1200&height=628&seed=${seed}`;
      setImagenUrl(url);
      addLog('✓ Imagen generada', 'ok');

      // Guardar en Google Sheets
      const entrada = { id: Date.now(), fecha: new Date().toLocaleDateString('es-ES'), tema: temaSeleccionado, formato, contenido: texC, imagenUrl: url };
      fetch('/api/historial', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entrada) }).catch(() => {});
      setHistorial(prev => [entrada, ...prev].slice(0, 20));

      setFase('resultado');
      setFaseActual('');
    } catch (err) {
      addLog(`✗ Error: ${err.message}`, 'error');
      setFaseActual('');
    }
  };

  const copiar = () => {
    navigator.clipboard.writeText(contenido);
    setCopiado(true);
    setTimeout(() => setCopiado(false), 2000);
  };

  const reiniciar = () => {
    setFase('inicio');
    setTemaSeleccionado(null);
    setTemaPersonalizado('');
    setFormato('post');
    setLogs([]);
    setContenido('');
    setCritica(null);
    setImagenUrl('');
  };

  if (fase === 'inicio') return (
    <div style={S.app}>
      <div style={S.header}>
        <div style={S.logo}>LINKEDIN CONTENT AGENT</div>
        <h1 style={S.title}>Generador de contenido</h1>
        <p style={S.subtitle}>5 agentes que investigan, debaten y escriben desde tu voz</p>
      </div>
      <div style={S.main}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 32 }}>
          {[
            { icon: '🔍', label: 'Investigador', desc: 'Analiza tendencias y prepara el debate' },
            { icon: '⚔️', label: 'Debatistas A & B', desc: 'Dos perspectivas opuestas con argumentos reales' },
            { icon: '✍️', label: 'Editor', desc: 'Sintetiza el debate en tu voz' },
            { icon: '🎯', label: 'Crítico', desc: 'Puntúa y recomienda si publicar' },
          ].map((a, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '16px 18px', display: 'flex', gap: 12, alignItems: 'flex-start' }}>
              <span style={{ fontSize: 22 }}>{a.icon}</span>
              <div>
                <div style={{ fontSize: 13, fontWeight: 'bold', fontFamily: 'system-ui', marginBottom: 3 }}>{a.label}</div>
                <div style={{ fontSize: 12, color: C.muted, fontFamily: 'system-ui' }}>{a.desc}</div>
              </div>
            </div>
          ))}
        </div>
        <button style={S.btn} onClick={() => setFase('temas')}>Empezar → Elegir tema</button>

        {historial.length > 0 && (
          <div style={{ marginTop: 32 }}>
            <div style={{ fontSize: 11, letterSpacing: 3, color: C.muted, fontFamily: 'monospace', marginBottom: 16 }}>HISTORIAL ({historial.length})</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {historial.map(h => (
                <div key={h.id} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '14px 18px', display: 'flex', gap: 14, alignItems: 'flex-start', cursor: 'pointer' }}
                  onClick={() => { setContenido(h.contenido); setTemaSeleccionado(h.tema); setFormato(h.formato); setImagenUrl(h.imagenUrl || ''); setCritica(null); setFase('resultado'); }}>
                  {h.imagenUrl && <img src={h.imagenUrl} alt="" style={{ width: 80, height: 42, objectFit: 'cover', borderRadius: 6, flexShrink: 0 }} />}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, color: C.text, marginBottom: 3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{h.tema}</div>
                    <div style={{ fontSize: 10, color: C.muted }}>{h.formato} · {h.fecha}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );

  if (fase === 'temas') return (
    <div style={S.app}>
      <div style={S.header}>
        <div style={S.logo}>AGENTE 1 · SELECCIÓN DE TEMA</div>
        <h1 style={S.title}>¿Sobre qué escribimos hoy?</h1>
        <p style={S.subtitle}>Elige un tema o escribe el tuyo</p>
      </div>
      <div style={S.main}>
        {TEMAS.map(cat => (
          <div key={cat.cat} style={{ marginBottom: 24 }}>
            <div style={S.catLabel}><span style={{ fontSize: 16 }}>{cat.icon}</span>{cat.cat.toUpperCase()}</div>
            {cat.items.map((tema, i) => (
              <button key={i}
                style={{ ...S.temaCard, ...(hoveredTema === `${cat.cat}-${i}` ? S.temaCardHover : {}) }}
                onMouseEnter={() => setHoveredTema(`${cat.cat}-${i}`)}
                onMouseLeave={() => setHoveredTema(null)}
                onClick={() => elegirTema(tema)}
              >{tema}</button>
            ))}
          </div>
        ))}
        <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 24, marginTop: 8 }}>
          <div style={S.catLabel}>▦ TEMA PERSONALIZADO</div>
          <div style={{ display: 'flex', gap: 10 }}>
            <input style={S.input} placeholder="Escribe tu propio tema..." value={temaPersonalizado}
              onChange={e => setTemaPersonalizado(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && temaPersonalizado.trim() && elegirTema(temaPersonalizado.trim())}
            />
            <button style={{ ...S.btn, opacity: temaPersonalizado.trim() ? 1 : 0.4 }}
              onClick={() => temaPersonalizado.trim() && elegirTema(temaPersonalizado.trim())}>→</button>
          </div>
        </div>
      </div>
    </div>
  );

  if (fase === 'formato') return (
    <div style={S.app}>
      <div style={S.header}>
        <div style={S.logo}>CONFIGURACIÓN</div>
        <h1 style={S.title}>Tema elegido</h1>
        <p style={S.subtitle}>"{temaSeleccionado}"</p>
      </div>
      <div style={S.main}>
        <span style={S.sTitle}>¿QUÉ FORMATO?</span>
        <div style={{ display: 'flex', gap: 12, marginBottom: 32 }}>
          <button style={S.formatBtn(formato === 'post')} onClick={() => setFormato('post')}>📝 Post (300-500 palabras)</button>
          <button style={S.formatBtn(formato === 'articulo')} onClick={() => setFormato('articulo')}>📰 Artículo (600-900 palabras)</button>
        </div>
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '18px 20px', marginBottom: 28, fontFamily: 'system-ui' }}>
          <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>
            {formato === 'post' ? '✅ Ideal para generar engagement rápido. Más corto, impacto inmediato.' : '✅ Ideal para posicionarte como experto. Más profundo, más tiempo de lectura.'}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 12 }}>
          <button style={S.btn} onClick={iniciarGeneracion}>🚀 Generar contenido</button>
          <button style={S.btnSecondary} onClick={() => setFase('temas')}>← Cambiar tema</button>
        </div>
      </div>
    </div>
  );

  if (fase === 'generando') return (
    <div style={S.app}>
      <div style={S.header}>
        <div style={S.logo}>GENERANDO CONTENIDO</div>
        <h1 style={S.title}>Los agentes están trabajando...</h1>
        <p style={S.subtitle}>Tema: "{temaSeleccionado}"</p>
      </div>
      <div style={S.main}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 24, flexWrap: 'wrap' }}>
          {['investigador', 'debatista_a', 'debatista_b', 'editor', 'critico', 'imagen'].map((f, i) => (
            <span key={f} style={{
              padding: '4px 12px', borderRadius: 999, fontSize: 11, fontFamily: 'monospace',
              background: faseActual === f ? C.accent : isDark ? '#111827' : '#f1f5f9',
              color: faseActual === f ? '#fff' : C.muted,
              border: `1px solid ${faseActual === f ? C.accent : C.border}`,
            }}>
              {['🔍 Investigador', '⚔️ Debate A', '⚔️ Debate B', '✍️ Editor', '🎯 Crítico', '🖼️ Imagen'][i]}
            </span>
          ))}
        </div>

        <div style={S.logBox}>
          {logs.map((l, i) => (
            <div key={i} style={{ color: logColor[l.tipo] || C.muted, marginBottom: 4 }}>
              {l.msg}
            </div>
          ))}
        </div>

        {streamText && (
          <div style={{ marginTop: 16 }}>
            <div style={{ fontSize: 10, color: C.muted, fontFamily: 'monospace', letterSpacing: 2, marginBottom: 8 }}>STREAM EN VIVO</div>
            <div style={S.streamBox}>{streamText}</div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>
    </div>
  );

  if (fase === 'resultado') return (
    <div style={S.app}>
      <div style={S.header}>
        <div style={S.logo}>RESULTADO</div>
        <h1 style={S.title}>{formato === 'post' ? 'Post' : 'Artículo'} generado</h1>
        <p style={S.subtitle}>"{temaSeleccionado}"</p>
      </div>
      <div style={S.main}>

        {critica && (
          <div style={{ background: isDark ? '#0C1A0C' : '#f0fdf4', border: `1px solid ${isDark ? '#166534' : '#86efac'}`, borderRadius: 10, padding: 20, marginBottom: 24, fontFamily: 'system-ui' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
              <div style={{ fontSize: 11, letterSpacing: 2, color: C.green, fontFamily: 'monospace' }}>EVALUACIÓN DEL CRÍTICO</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{ fontSize: 36, fontWeight: 'bold', color: critica.puntuacion >= 7 ? C.green : critica.puntuacion >= 5 ? C.gold : C.red, fontFamily: 'monospace' }}>
                  {critica.puntuacion}<span style={{ fontSize: 16, color: C.muted }}>/10</span>
                </div>
                {critica.veredicto && <span style={S.pill(critica.veredicto)}>{critica.veredicto}</span>}
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, fontSize: 13 }}>
              <div>
                <div style={{ fontSize: 10, color: C.green, fontFamily: 'monospace', letterSpacing: 2, marginBottom: 6 }}>PUNTOS FUERTES</div>
                {critica.puntos_fuertes?.map((p, i) => <div key={i} style={{ color: isDark ? '#D1FAE5' : '#065f46', marginBottom: 3 }}>✓ {p}</div>)}
              </div>
              <div>
                <div style={{ fontSize: 10, color: C.gold, fontFamily: 'monospace', letterSpacing: 2, marginBottom: 6 }}>MEJORAS</div>
                {critica.mejoras?.map((m, i) => <div key={i} style={{ color: isDark ? '#FEF3C7' : '#92400e', marginBottom: 3 }}>→ {m}</div>)}
              </div>
            </div>
            {critica.gancho && <div style={{ marginTop: 10, fontSize: 12, color: C.muted, fontStyle: 'italic' }}>Gancho: {critica.gancho}</div>}
          </div>
        )}

        {imagenUrl && (
          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 11, letterSpacing: 3, color: C.accent, fontFamily: 'monospace', marginBottom: 12 }}>IMAGEN PARA LINKEDIN</div>
            <img src={imagenUrl} alt="LinkedIn post image" style={{ width: '100%', borderRadius: 10, border: `1px solid ${C.border}`, display: 'block' }} />
            <div style={{ display: 'flex', gap: 10, marginTop: 10 }}>
              <a href={imagenUrl} download="linkedin-imagen.jpg" target="_blank" rel="noopener noreferrer"
                style={{ ...S.btnSecondary, textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                ⬇ Descargar imagen
              </a>
            </div>
          </div>
        )}

        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, letterSpacing: 3, color: C.accent, fontFamily: 'monospace', marginBottom: 12 }}>
            CONTENIDO LISTO PARA LINKEDIN
          </div>
          <div style={S.contentBox}>{contenido}</div>
        </div>

        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          <button style={S.btn} onClick={copiar}>
            {copiado ? '✓ Copiado!' : '📋 Copiar al portapapeles'}
          </button>
          <button style={S.btnSecondary} onClick={reiniciar}>↩ Nuevo contenido</button>
        </div>

        {investigacion && (
          <div style={{ marginTop: 32, padding: 20, background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, fontFamily: 'system-ui' }}>
            <div style={{ fontSize: 10, color: C.muted, fontFamily: 'monospace', letterSpacing: 2, marginBottom: 12 }}>DEBATE INTERNO</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
              <div>
                <div style={{ fontSize: 11, color: C.accent, fontFamily: 'monospace', marginBottom: 6 }}>PERSPECTIVA A</div>
                <div style={{ fontSize: 12, color: C.muted, fontStyle: 'italic', marginBottom: 8 }}>{investigacion.posicion_a?.titulo}</div>
                <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6 }}>{argA?.substring(0, 200)}...</div>
              </div>
              <div>
                <div style={{ fontSize: 11, color: C.gold, fontFamily: 'monospace', marginBottom: 6 }}>PERSPECTIVA B</div>
                <div style={{ fontSize: 12, color: C.muted, fontStyle: 'italic', marginBottom: 8 }}>{investigacion.posicion_b?.titulo}</div>
                <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6 }}>{argB?.substring(0, 200)}...</div>
              </div>
            </div>
          </div>
        )}

        <div ref={bottomRef} />
      </div>
    </div>
  );

  return null;
}

function App() {
  const [isDark, setIsDark] = React.useState(() => {
    try { return localStorage.getItem('theme') !== 'light'; } catch { return true; }
  });
  const toggle = () => {
    const next = !isDark;
    setIsDark(next);
    try { localStorage.setItem('theme', next ? 'dark' : 'light'); } catch {}
    document.body.style.background = next ? '#080b0f' : '#f1f5f9';
  };
  React.useEffect(() => {
    document.body.style.background = isDark ? '#080b0f' : '#f1f5f9';
  }, []);
  return (
    <>
      <button
        onClick={toggle}
        style={{
          position:'fixed', top:12, right:12, zIndex:9999,
          background: isDark ? '#0e1117' : '#ffffff',
          border: `1px solid ${isDark ? '#1c2230' : '#e2e8f0'}`,
          borderRadius:8, padding:'6px 14px', cursor:'pointer',
          color: isDark ? '#e2e8f0' : '#0f172a',
          fontFamily:"'Space Mono',monospace", fontSize:'0.7rem',
          transition:'all 0.2s',
        }}
      >{isDark ? '☀ Claro' : '◑ Oscuro'}</button>
      <LinkedInAgent isDark={isDark} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
